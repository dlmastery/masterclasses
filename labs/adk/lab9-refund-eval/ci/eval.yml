# Copy to .github/workflows/eval.yml at the repository root.
name: eval-gate
on: [pull_request]
jobs:
  eval:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: labs/adk/lab9-refund-eval
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.11"}
      - run: pip install "google-adk[eval]==2.13.0"
      - env:
          GOOGLE_GENAI_USE_ENTERPRISE: "FALSE"
          GOOGLE_API_KEY: ${{ secrets.GOOGLE_API_KEY }}
        run: bash ci/eval_gate.sh
