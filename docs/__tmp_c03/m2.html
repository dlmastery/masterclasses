<!doctype html><html><body style="margin:0"><iframe id="f" style="width:1600px;height:900px;border:0"></iframe><pre id="out">pending</pre>
<script>
const T = ["rag-c03-embedding-models/6"];
const f = document.getElementById("f"); const res = [];
f.src = "/rag/index.html#" + T[0];
const wait = (ms) => new Promise(r => setTimeout(r, ms));
(async () => {
  await wait(4000);
  for (const t of T) {
    f.contentWindow.location.hash = t; await wait(3500);
    const d = f.contentDocument, id = t.split("/")[0], s = d.getElementById(id), sb = s.getBoundingClientRect();
    const sc = sb.width / 1600; const bad = [];
    s.querySelectorAll("*").forEach(e => {
      if (e.closest("svg") && e.tagName !== "svg") return;
      if (e.closest(".notes")) return;
      const b = e.getBoundingClientRect(); if (!b.height) return;
      const y = (b.bottom - sb.top) / sc, x = (b.right - sb.left) / sc;
      if (y > 826 || x > 1498) bad.push(`${e.tagName}.${(e.className && e.className.baseVal !== undefined ? e.className.baseVal : e.className) || ""} b=${Math.round(y)} r=${Math.round(x)} "${(e.textContent||"").trim().slice(0,30)}"`);
    });
    s.querySelectorAll(".stack > *, tr").forEach(e => { const b = e.getBoundingClientRect(); bad.push("H " + e.tagName + "." + e.className + " top=" + Math.round((b.top-sb.top)/sc) + " h=" + Math.round(b.height/sc)); }); s.querySelectorAll("pre.code").forEach(p => { if (p.scrollWidth > p.clientWidth + 2) bad.push("PRE overflow-x " + p.scrollWidth + ">" + p.clientWidth); });
    res.push(t + " scale=" + sc.toFixed(3) + "\n  " + (bad.slice(0, 60).join("\n  ") || "OK"));
  }
  document.getElementById("out").textContent = "RESULT\n" + res.join("\n");
})();
</script></body></html>
